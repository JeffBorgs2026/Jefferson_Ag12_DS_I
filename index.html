<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Linha 4: Configuração de codificação de caracteres -->
    <meta charset="UTF-8">
    <!-- Linha 6: Responsividade para dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Linha 8: Título exibido na aba do navegador conforme pedido -->
    <title>Meus sites favoritos</title>
    <style>
        /* Estilos básicos para deixar a página organizada e limpa */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
        }
        .site-container {
            background: #ffffff;
            margin: 20px auto;
            padding: 20px;
            border-radius: 8px;
            max-width: 600px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        img {
            max-width: 100%;
            height: auto;
            border: 2px solid #ccc;
            border-radius: 4px;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        a {
            display: inline-block;
            color: #2980b9;
            text-decoration: none;
            font-weight: bold;
            margin-top: 5px;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Título principal do corpo da página -->
    <h1>Meus sites favoritos: Jefferson Borges Calaça</h1>
    <p>Lista de portais e plataformas essenciais para estudos, produtividade e passatempo.</p>

    <!-- Item 1: GitHub -->
    <div class="site-container">
        <!-- Nome do site utilizando h1 (conforme sugestão da atividade) -->
        <h1>GitHub</h1>
        <!-- Imagem do site (salve a imagem na mesma pasta com o nome github.png) -->
        <a href="https://github.com" target="_blank">
            <img src="github.png" alt="Logotipo do GitHub">
        </a>
        <br>
        <!-- Link para o site abaixo da imagem -->
        <a href="https://github.com" target="_blank">Acessar o GitHub</a>
    </div>

    <!-- Item 2: Stack Overflow -->
    <div class="site-container">
        <h1>Stack Overflow</h1>
        <a href="https://stackoverflow.com" target="_blank">
            <img src="stackoverflow.png" alt="Logotipo do Stack Overflow">
        </a>
        <br>
        <a href="https://stackoverflow.com" target="_blank">Acessar o Stack Overflow</a>
    </div>

    <!-- Item 3: W3Schools -->
    <div class="site-container">
        <h1>W3Schools</h1>
        <a href="https://www.w3schools.com" target="_blank">
            <img src="w3schools.png" alt="Logotipo do W3Schools">
        </a>
        <br>
        <a href="https://www.w3schools.com" target="_blank">Acessar o W3Schools</a>
    </div>

    <!-- Item 4: Wikipedia -->
    <div class="site-container">
        <h1>Wikipédia</h1>
        <a href="https://pt.wikipedia.org" target="_blank">
            <img src="wikipedia.png" alt="Logotipo da Wikipédia">
        </a>
        <br>
        <a href="https://pt.wikipedia.org" target="_blank">Acessar a Wikipédia</a>
    </div>

    <!-- Item 5: Python.org -->
    <div class="site-container">
        <h1>Python</h1>
        <a href="https://www.python.org" target="_blank">
            <img src="python.png" alt="Logotipo do Python">
        </a>
        <br>
        <a href="https://www.python.org" target="_blank">Acessar o Python.org</a>
    </div>

</body>
</html>
